name: Update Offers Data

on:
  workflow_dispatch:
  schedule:
    # Taiwan time (UTC+8): every Monday 08:15
    - cron: "15 0 * * 1"

permissions:
  contents: write

jobs:
  update-offers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update offers data
        run: npm run update:offers

      - name: Commit changes if any
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/cards.json data/snapshots
            git commit -m "chore: auto update credit card offers"
            git push
          else
            echo "No data changes."
          fi
